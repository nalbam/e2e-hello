apiVersion: agent.opspresso.com/v3
kind: Application
spec:
  name: e2e-hello-2
  owner: dBT43yQ7DQIIIMlYbjiXsIr8tbuIgVJA
  repository: nalbam/e2e-hello
  description: E2E hello Node.js HTTP server
runtime:
  type: k8s
  architecture: arm64
  port: 8080
  health: /health
pipeline:
  trigger:
    branch: main
  build:
    context: .
    dockerfile: Dockerfile
  test:
    image: node:24-alpine
    command: npm ci && npm test
# Promotion order: a push to main deploys to dev; prod receives a Release only by promotion.
environments:
  - name: dev
    size: small
    env:
      LOG_LEVEL: info
    resources:
      - name: e2e-hello-db
        template: postgres
  - name: prod
    size: small
    resources:
      - name: e2e-hello-db
        template: postgres
